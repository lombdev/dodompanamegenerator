<html lang="pt">

<head>
	<title>Gerador de nomes do Dodompa</title>
	<link href="styles.css"
		  rel="stylesheet">
</head>

<body>

	<div class="container">

		<h2>Gerador de nomes do Dodompa V3.0</h2>

		<div style="display: ruby;">
			<input type="button"
				   value="Gerar"
				   onclick="AskQuestion()" />
			</br>

			<label class="triple-label">
				<input type="checkbox"
					   id="tripleMode" />
				Modo Triplo
			</label>
		</div>

		<div id="bl"
			 style="visibility: visible">
			<h1 class="red"
				id="lblAnswer"></h1>
		</div>

		<div id="historySection">
			<p class="history-label"
			   id="historyLabel"
			   style="display:none">Anteriores:</p>
			<h1 class="history-entry"
				id="history1"></h1>
			<h1 class="history-entry"
				id="history2"></h1>
		</div>

		<input type="button"
			   class="arena-btn"
			   value="🤫 Batalha de Nomes"
			   onclick="window.location.href='battle.html'" />
		</br>

	</div>
	<script src="effects.js"></script>
	<script src="string.js"></script>
	<script src="script.js"></script>
</body>

</html>
